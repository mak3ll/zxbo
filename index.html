<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>zxbo cnfgs</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --p:#8b72ff;
  --t:#00e5c8;
  --a:#f5c842;
  --bg:#060609;
}

html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;color:#e0e0d8}
body{display:flex;align-items:center;justify-content:center}

canvas{position:fixed;inset:0;z-index:0;opacity:.6}

.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 30%,rgba(6,6,9,.92) 100%);
}

.wrap{
  position:relative;z-index:2;
  width:100%;max-width:500px;
  padding:0 24px;
  text-align:center;
}

/* badge */
.badge{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(139,114,255,.75);
  border:1px solid rgba(139,114,255,.2);border-radius:3px;
  padding:4px 12px;margin-bottom:18px;
  animation:up .5s both;
}
.dot{width:5px;height:5px;border-radius:50%;background:var(--p);box-shadow:0 0 7px var(--p);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* headline */
.headline{
  font-size:clamp(40px,8vw,60px);font-weight:900;
  line-height:1;letter-spacing:-.03em;color:#f0f0e8;
  margin-bottom:7px;animation:up .5s .08s both;
}
.headline .leak{
  color:var(--p);
  text-shadow:0 0 40px rgba(139,114,255,.4);
  display:inline-block;
  animation:glitch 9s infinite;
}
@keyframes glitch{
  0%,88%,100%{clip-path:none;text-shadow:0 0 40px rgba(139,114,255,.4)}
  90%{clip-path:inset(0 0 65% 0);text-shadow:-3px 0 rgba(0,229,200,.8),3px 0 rgba(245,200,66,.8)}
  92%{clip-path:inset(55% 0 15% 0);text-shadow:3px 0 rgba(0,229,200,.8),-3px 0 rgba(245,200,66,.8)}
  94%{clip-path:inset(20% 0 50% 0);text-shadow:-3px 0 rgba(0,229,200,.8),3px 0 rgba(245,200,66,.8)}
  96%{clip-path:none;text-shadow:0 0 40px rgba(139,114,255,.4)}
}

.sub{
  font-family:'Space Mono',monospace;font-size:10px;
  color:rgba(255,255,255,.14);letter-spacing:.1em;
  margin-bottom:20px;animation:up .5s .14s both;
}

/* main btn */
.main-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;text-decoration:none;
  color:rgba(139,114,255,.85);
  border:1px solid rgba(139,114,255,.28);border-radius:4px;
  padding:9px 20px;
  background:rgba(139,114,255,.07);
  transition:all .2s;
  margin-bottom:24px;animation:up .5s .2s both;
}
.main-btn:hover{
  background:rgba(139,114,255,.15);
  border-color:rgba(139,114,255,.55);
  color:#c4baff;
  box-shadow:0 0 22px rgba(139,114,255,.15);
}
.arr{display:inline-block;transition:transform .15s}
.main-btn:hover .arr{transform:translateX(3px)}

/* section label */
.label{
  font-family:'Space Mono',monospace;font-size:9px;
  letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,255,255,.12);
  text-align:left;margin-bottom:6px;margin-top:12px;
  display:flex;align-items:center;gap:10px;
}
.label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05)}

/* cards */
.card{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.06);
  border-radius:8px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:5px;
  position:relative;overflow:hidden;
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
}
.card:last-child{margin-bottom:0}
.card::after{
  content:'';position:absolute;top:0;left:15%;right:15%;height:1px;
  opacity:0;transition:opacity .2s;
}
.card.tc::after{background:linear-gradient(90deg,transparent,var(--t),transparent)}
.card.pc::after{background:linear-gradient(90deg,transparent,var(--p),transparent)}
.card.ac::after{background:linear-gradient(90deg,transparent,var(--a),transparent)}
.card:hover{transform:translateY(-1px);background:rgba(255,255,255,.04)}
.card:hover::after{opacity:1}
.card.tc:hover{border-color:rgba(0,229,200,.22);box-shadow:0 6px 28px rgba(0,229,200,.055)}
.card.pc:hover{border-color:rgba(139,114,255,.22);box-shadow:0 6px 28px rgba(139,114,255,.055)}
.card.ac:hover{border-color:rgba(245,200,66,.22);box-shadow:0 6px 28px rgba(245,200,66,.055)}

.card-left{display:flex;align-items:center;gap:10px}

.icon{
  width:30px;height:30px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;
}
.icon.t{background:rgba(0,229,200,.08);border:1px solid rgba(0,229,200,.14);color:var(--t)}
.icon.p{background:rgba(139,114,255,.08);border:1px solid rgba(139,114,255,.14);color:var(--p)}
.icon.a{background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.14);color:var(--a)}

.name{font-size:14px;font-weight:700}
.name.t{color:var(--t)}
.name.p{color:#b3a9ff}
.name.w{color:#ddddd5}

.price{
  font-family:'Space Mono',monospace;font-size:9px;
  color:rgba(245,200,66,.45);margin-top:2px;letter-spacing:.04em;
}

/* small btns */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
  padding:6px 11px;border-radius:4px;
  transition:all .15s;flex-shrink:0;
}
.btn .arr{display:inline-block;transition:transform .15s}
.btn:hover .arr{transform:translateX(3px)}
.btn.t{color:var(--t);background:rgba(0,229,200,.07);border:1px solid rgba(0,229,200,.17)}
.btn.t:hover{background:rgba(0,229,200,.16);border-color:rgba(0,229,200,.45);box-shadow:0 0 14px rgba(0,229,200,.1)}
.btn.p{color:#b3a9ff;background:rgba(139,114,255,.07);border:1px solid rgba(139,114,255,.17)}
.btn.p:hover{background:rgba(139,114,255,.16);border-color:rgba(139,114,255,.45);box-shadow:0 0 14px rgba(139,114,255,.1)}
.btn.a{color:var(--a);background:rgba(245,200,66,.07);border:1px solid rgba(245,200,66,.17)}
.btn.a:hover{background:rgba(245,200,66,.16);border-color:rgba(245,200,66,.45);box-shadow:0 0 14px rgba(245,200,66,.1)}

.footer{
  font-family:'Space Mono',monospace;font-size:9px;
  letter-spacing:.15em;text-transform:uppercase;
  color:rgba(255,255,255,.07);
  text-align:center;margin-top:16px;
  animation:up .5s .5s both;
}

.scripts-s{animation:up .5s .28s both}
.buy-s{animation:up .5s .36s both}

@keyframes up{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div class="wrap">

  <div class="badge"><span class="dot"></span> zxbo cnfgs</div>

  <div class="headline">we <span class="leak">leak</span> configs.</div>
  <div class="sub">(paid &amp; private ones)</div>

  <a class="main-btn" href="https://discord.gg/cjJdh3xQFM" target="_blank">
    Join our Discord <span class="arr">→</span>
  </a>

  <div class="scripts-s">
    <div class="label">scripts <span></span></div>

    <div class="card tc">
      <div class="card-left">
        <div class="icon t">⚡</div>
        <div class="name t">Kicia</div>
      </div>
      <a class="btn t" href="https://discord.gg/kicia" target="_blank">Join Discord <span class="arr">→</span></a>
    </div>

    <div class="card pc">
      <div class="card-left">
        <div class="icon p">✦</div>
        <div class="name p">Unamed Enhancements</div>
      </div>
      <a class="btn p" href="https://discord.gg/zbPF5Yt2yn" target="_blank">Join Discord <span class="arr">→</span></a>
    </div>
  </div>

  <div class="buy-s">
    <div class="label">buy configs <span></span></div>

    <div class="card ac">
      <div class="card-left">
        <div class="icon a">◈</div>
        <div>
          <div class="name w">Legit Config</div>
          <div class="price">60 robux</div>
        </div>
      </div>
      <a class="btn a" href="https://discord.gg/cjJdh3xQFM" target="_blank">Buy <span class="arr">→</span></a>
    </div>

    <div class="card ac">
      <div class="card-left">
        <div class="icon a">◈</div>
        <div>
          <div class="name w">Rage Config</div>
          <div class="price">60 robux</div>
        </div>
      </div>
      <a class="btn a" href="https://discord.gg/cjJdh3xQFM" target="_blank">Buy <span class="arr">→</span></a>
    </div>
  </div>

  <p class="footer">zxbo cnfgs — all configs accessed via discord</p>
</div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,pts;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
function init(){
  pts=Array.from({length:70},()=>({
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*.8+.2,
    vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,
    o:Math.random()*.45+.08,
    c:Math.random()>.55?0:Math.random()>.5?1:2
  }));
}
const cols=['rgba(139,114,255,','rgba(0,229,200,','rgba(245,200,66,'];
function draw(){
  cx.clearRect(0,0,W,H);
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<110){cx.strokeStyle=`rgba(139,114,255,${(1-d/110)*.055})`;cx.lineWidth=.4;cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.stroke()}
  }
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=cols[p.c]+p.o+')';cx.fill();
  });
  requestAnimationFrame(draw);
}
resize();init();draw();
window.addEventListener('resize',()=>{resize();init()});
</script>
</body>
</html>
